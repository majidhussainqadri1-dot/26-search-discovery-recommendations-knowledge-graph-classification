name: Diagnose File 26 Bootstrap R3
on:
  push:
    branches:
      - codex/file26-complete-v1.0.0-r3
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture bootstrap and QA diagnostics
        shell: bash
        run: |
          set -u
          if [ -f bootstrap-r3-diagnostic.txt ]; then
            echo 'Diagnostic already committed.'
            exit 0
          fi
          exec > >(tee bootstrap-r3-diagnostic.txt) 2>&1
          set +e
          : > /tmp/file26-source.tar.gz
          for sha in 3e36dfbb5581234f46f76f4d7fe70be1aea0a5f8 fc6bed7b9ea7d7e57d3651c3e8c25da8dabfad1b 308b0e0edab2f1d9caecc111bd815fd4cfcd772e 246b07469e7c95296f623c7bc6ed9a8c6a670afc 466da3b34872a1bf7bb3c367d2240a3e410c6b31 42f562014608060a2048950e87d3460ad5923aca c2af48a409c2209e62be5c5e202225cb384a820c 7eebb2592e267fab873771e253fafa8795cabfff; do git cat-file blob "$sha" >> /tmp/file26-source.tar.gz; done
          sha256sum /tmp/file26-source.tar.gz
          gzip -t /tmp/file26-source.tar.gz; echo "gzip=$?"
          mkdir -p /tmp/file26-source
          tar -xzf /tmp/file26-source.tar.gz -C /tmp/file26-source; echo "tar=$?"
          rsync -a --delete --exclude='.git/' --exclude='bootstrap-r3-diagnostic.txt' /tmp/file26-source/ ./; echo "rsync=$?"
          bash qa/run-tests.sh; echo "qa=$?"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: record File 26 bootstrap r3 diagnostics'
          git push origin HEAD:codex/file26-complete-v1.0.0-r3
