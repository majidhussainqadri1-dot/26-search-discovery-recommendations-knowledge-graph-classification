name: Bootstrap File 26 Source
on:
  push:
    branches:
      - codex/file26-complete-v1.0.0-r2
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand, verify and test reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/file26-source.tar.gz
          for sha in \
            72192aca18a5b4cddd4889d040bdff170055adc4 \
            fc6bed7b9ea7d7e57d3651c3e8c25da8dabfad1b \
            308b0e0edab2f1d9caecc111bd815fd4cfcd772e \
            246b07469e7c95296f623c7bc6ed9a8c6a670afc \
            466da3b34872a1bf7bb3c367d2240a3e410c6b31 \
            42f562014608060a2048950e87d3460ad5923aca \
            c2af48a409c2209e62be5c5e202225cb384a820c \
            7eebb2592e267fab873771e253fafa8795cabfff
          do
            git cat-file blob "$sha" >> /tmp/file26-source.tar.gz
          done
          sha256sum /tmp/file26-source.tar.gz
          echo '017228cfa65888f0ac31a0148b7b33fc2822f366ed3bbdf60cdb80998f01c188  /tmp/file26-source.tar.gz' | sha256sum -c -
          gzip -t /tmp/file26-source.tar.gz
          mkdir -p /tmp/file26-source
          tar -xzf /tmp/file26-source.tar.gz -C /tmp/file26-source
          rsync -a --delete --exclude='.git/' /tmp/file26-source/ ./
          bash qa/run-tests.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement File 26 complete search and discovery system'
          git push origin HEAD:codex/file26-complete-v1.0.0-r2
