name: Diagnose File 26 Bootstrap
on:
  push:
    branches:
      - codex/file26-complete-v1.0.0-r2
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture bootstrap diagnostics
        shell: bash
        run: |
          set -u
          if [ -f bootstrap-diagnostic.txt ]; then
            echo 'Diagnostic already committed.'
            exit 0
          fi
          exec > >(tee bootstrap-diagnostic.txt) 2>&1
          set +e
          echo "HEAD=$(git rev-parse HEAD)"
          : > /tmp/file26-source.tar.gz
          for sha in \
            72192aca18a5b4cddd4889d040bdff170055adc4 \
            fc6bed7b9ea7d7e57d3651c3e8c25da8dabfad1b \
            308b0e0edab2f1d9caecc111bd815fd4cfcd772e \
            246b07469e7c95296f623c7bc6ed9a8c6a670afc \
            466da3b34872a1bf7bb3c367d2240a3e410c6b31 \
            42f562014608060a2048950e87d3460ad5923aca \
            c2af48a409c2209e62be5c5e202225cb384a820c \
            7eebb2592e267fab873771e253fafa8795cabfff
          do
            echo "BLOB $sha size=$(git cat-file -s "$sha" 2>&1) status=$?"
            git cat-file blob "$sha" >> /tmp/file26-source.tar.gz
            echo "append status=$?"
          done
          sha256sum /tmp/file26-source.tar.gz
          echo "sha status=$?"
          gzip -t /tmp/file26-source.tar.gz
          echo "gzip status=$?"
          tar -tzf /tmp/file26-source.tar.gz | head -20
          echo "tar status=${PIPESTATUS[0]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap-diagnostic.txt
          git commit -m 'chore: record bootstrap diagnostics'
          git push origin HEAD:codex/file26-complete-v1.0.0-r2
