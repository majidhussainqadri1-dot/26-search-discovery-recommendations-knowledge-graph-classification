name: File 26 QA
on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'integrate/**', 'review/**', 'audit/**']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / node24
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert checkout equals exact candidate source head
        env:
          FILE26_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$FILE26_EXPECTED_SOURCE_SHA" || { echo "FAIL: File26 QA checked out a synthetic merge/other commit."; exit 1; }
          echo "PASS: exact-source checkout $actual"
      - uses: shivammathur/setup-php@fc14643b0a99ee9db10a3c025a33d76544fa3761 # 2.30.5
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 / node24
        with:
          node-version: '22'
      - name: Run complete local QA
        run: bash qa/run-tests.sh
      - name: Upload deterministic package and checksum
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / node24
        with:
          name: file26-wordpress-package-1.3.0
          path: |
            release/26-sabri-file26-search-discovery-1.3.0.zip
            release/CHECKSUMS.sha256
          if-no-files-found: error

  forty_round_verification:
    name: Forty full QA review repetitions
    needs: qa
    if: github.event_name == 'pull_request' && (github.head_ref == 'integrate/file26-future24-main-parity-20261019' || github.head_ref == 'audit/file26-fresh40-and-crossrepo-parity-20261019' || github.head_ref == 'audit/file26-20261020-forty-reliability-and-owner-parity' || github.head_ref == 'audit/file26-20261020-merged-parity-graph-cursor' || github.head_ref == 'integrate/file26-v123-pr39-doctor-hardening-20261115' || github.head_ref == 'audit/file26-v12-shadow-index-20261108' || startsWith(github.head_ref, 'fix/file26-v12-3-'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert forty-round source equals exact Pull Request head
        env:
          FILE26_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$FILE26_EXPECTED_SOURCE_SHA" || { echo "FAIL: forty-round QA uses non-exact PR source."; exit 1; }
          echo "PASS: 40 review rounds pinned to candidate $actual"
      - uses: shivammathur/setup-php@fc14643b0a99ee9db10a3c025a33d76544fa3761
        with:
          php-version: '8.3'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Run forty sequential whole-source and package reviews
        run: bash qa/run-forty-complete-reviews.sh
      - name: Upload forty-round review ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: file26-20261020-forty-full-review-ledger
          path: release/FILE26-20261020-FRESH40-RESULTS.tsv
          if-no-files-found: error
