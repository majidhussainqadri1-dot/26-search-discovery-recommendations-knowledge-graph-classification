name: File 26 QA
on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'integrate/**', 'review/**']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / node24
      - uses: shivammathur/setup-php@fc14643b0a99ee9db10a3c025a33d76544fa3761 # 2.30.5
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 / node24
        with:
          node-version: '22'
      - name: Run complete local QA
        run: bash qa/run-tests.sh
      - name: Upload deterministic package and checksum
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / node24
        with:
          name: file26-wordpress-package-1.3.0
          path: |
            release/26-sabri-file26-search-discovery-1.3.0.zip
            release/CHECKSUMS.sha256
          if-no-files-found: error

  forty_round_verification:
    name: Forty full QA review repetitions
    needs: qa
    if: github.event_name == 'pull_request' && (github.head_ref == 'integrate/file26-future24-main-parity-20261019' || github.head_ref == 'audit/file26-fresh40-and-crossrepo-parity-20261019' || github.head_ref == 'audit/file26-20261020-fresh40-queue-integrity')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@fc14643b0a99ee9db10a3c025a33d76544fa3761
        with:
          php-version: '8.3'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Run forty sequential whole-source and package reviews
        run: bash qa/run-forty-complete-reviews.sh
      - name: Upload forty-round review ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: file26-forty-full-review-ledger
          path: release/FILE26-20261020-FRESH40-RESULTS.tsv
          if-no-files-found: error
