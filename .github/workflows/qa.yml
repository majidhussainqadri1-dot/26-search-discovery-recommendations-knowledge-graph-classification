name: File 26 QA

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'review/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: file26-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runtime versions
        run: |
          php --version
          python3 --version
          node --version
      - name: Run repository and deterministic package QA
        run: bash qa/run-tests.sh
      - name: Upload exact-head installable package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: file26-1.2.0-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/26-sabri-file26-search-discovery-1.2.0.zip
            release/CHECKSUMS.sha256
