name: File 26 Foundation CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: write

jobs:
  apply-phase26e-payload:
    if: github.event_name == 'pull_request'
    name: Apply verified Phase 26E payload
    runs-on: ubuntu-latest
    concurrency:
      group: file26-phase26e-payload
      cancel-in-progress: false
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect transfer payload
        id: payload
        run: |
          if test -f tools/phase26e-payload.part00a; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up PHP
        if: steps.payload.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Verify and extract immutable payload
        if: steps.payload.outputs.present == 'true'
        run: |
          cat \
            tools/phase26e-payload.part00a \
            tools/phase26e-payload.part00b \
            tools/phase26e-payload.part00c \
            tools/phase26e-payload.part01 \
            tools/phase26e-payload.part02a \
            tools/phase26e-payload.part02b \
            tools/phase26e-payload.part02c \
            tools/phase26e-payload.part03a \
            tools/phase26e-payload.part03b \
            tools/phase26e-payload.part03c \
            > /tmp/phase26e-payload.b64
          echo '3f8a43e00619e887eaf411fdcb9dcd7d35f202b891baf532231d3454a3ae35ef  /tmp/phase26e-payload.b64' | sha256sum --check --strict
          base64 --decode /tmp/phase26e-payload.b64 | tar --extract --gzip --file -

      - name: Validate complete runtime
        if: steps.payload.outputs.present == 'true'
        run: |
          composer validate --strict
          composer lint
          composer test

      - name: Verify deterministic packaging
        if: steps.payload.outputs.present == 'true'
        run: |
          rm -rf /tmp/package-a /tmp/package-b
          python3 tools/build-package.py --output-dir /tmp/package-a
          python3 tools/build-package.py --output-dir /tmp/package-b
          diff -u /tmp/package-a/CHECKSUMS.sha256 /tmp/package-b/CHECKSUMS.sha256
          cmp /tmp/package-a/sabri-search-discovery-1.0.0.zip /tmp/package-b/sabri-search-discovery-1.0.0.zip
          cmp /tmp/package-a/sabri-search-discovery-1.0.0-source.zip /tmp/package-b/sabri-search-discovery-1.0.0-source.zip

      - name: Remove transfer-only machinery
        if: steps.payload.outputs.present == 'true'
        run: |
          rm -f tools/phase26e-payload.part*
          rm -f .github/workflows/apply-phase26e.yml
          git show 809121437821633bec146bcf401c74e0966bd318:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit verified complete runtime
        if: steps.payload.outputs.present == 'true'
        run: |
          git config user.name 'sabri-file26-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Complete File 26 runtime with two review and correction rounds'
          git push origin HEAD:${{ github.head_ref }}

  contract-tests:
    name: PHP ${{ matrix.php }} contract tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Lint PHP
        run: composer lint

      - name: Run contract and persistence tests
        run: composer test

      - name: Validate JSON fixtures
        run: |
          php -r 'json_decode(file_get_contents("config/connector-manifest.example.json"), true, 512, JSON_THROW_ON_ERROR);'
          php -r 'json_decode(file_get_contents("docs/contracts/connector-manifest.schema.json"), true, 512, JSON_THROW_ON_ERROR);'
          php -r 'json_decode(file_get_contents("tests/fixtures/golden-queries.json"), true, 512, JSON_THROW_ON_ERROR);'
