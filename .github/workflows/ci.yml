name: File 26 Complete Runtime CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  contract-tests:
    name: PHP ${{ matrix.php }} complete tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Lint every PHP file
        run: composer lint

      - name: Run phases 26A-26E and both review suites
        run: composer test

      - name: Validate JSON contracts and fixtures
        run: |
          php -r 'json_decode(file_get_contents("config/connector-manifest.example.json"), true, 512, JSON_THROW_ON_ERROR);'
          php -r 'json_decode(file_get_contents("docs/contracts/connector-manifest.schema.json"), true, 512, JSON_THROW_ON_ERROR);'
          php -r 'json_decode(file_get_contents("tests/fixtures/golden-queries.json"), true, 512, JSON_THROW_ON_ERROR);'

      - name: Reject transfer payloads and unresolved markers
        run: |
          ! find tools -maxdepth 1 -type f -name 'phase26e-payload.part*' -print -quit | grep -q .
          ! grep -RInE '[T]ODO|[F]IXME|[H]ACK|temporary[[:space:]]+payload|apply-phase26[e]' \
            --exclude-dir=.git \
            --exclude='*.md' \
            .

  deterministic-package:
    name: Deterministic package and source parity
    runs-on: ubuntu-latest
    needs: contract-tests

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6

      - name: Build package twice
        run: |
          rm -rf /tmp/file26-package-a /tmp/file26-package-b
          python3 tools/build-package.py --output-dir /tmp/file26-package-a
          python3 tools/build-package.py --output-dir /tmp/file26-package-b

      - name: Verify byte-for-byte determinism
        run: |
          diff -u /tmp/file26-package-a/CHECKSUMS.sha256 /tmp/file26-package-b/CHECKSUMS.sha256
          cmp /tmp/file26-package-a/sabri-search-discovery-1.0.0.zip /tmp/file26-package-b/sabri-search-discovery-1.0.0.zip
          cmp /tmp/file26-package-a/sabri-search-discovery-1.0.0-source.zip /tmp/file26-package-b/sabri-search-discovery-1.0.0-source.zip
          cmp /tmp/file26-package-a/SBOM.spdx.json /tmp/file26-package-b/SBOM.spdx.json
          unzip -t /tmp/file26-package-a/sabri-search-discovery-1.0.0.zip
          unzip -l /tmp/file26-package-a/sabri-search-discovery-1.0.0.zip | grep 'sabri-search-discovery/sabri-search-discovery.php'

      - name: Upload immutable candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: file-26-1.0.0-candidate
          path: /tmp/file26-package-a/*
          if-no-files-found: error
          retention-days: 30
