name: File 26 Disposable WordPress MariaDB Integration
on:
  pull_request:
    paths:
      - 'includes/**'
      - 'file-26-search-discovery.php'
      - 'tests/file26-20261109-wordpress-mysql-integration.php'
      - 'tests/file26-20261109-native-file10-public-owner.php'
      - '.github/workflows/file26-mysql-integration.yml'
  push:
    branches: ['audit/file26-v12-shadow-index-20261108']
permissions:
  contents: read
jobs:
  shadow-mysql:
    name: WordPress ${{ matrix.wordpress }} / MariaDB shadow, swap and rollback
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.8.3', '7.0.1', '7.1.4']
    timeout-minutes: 30
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wp-ephemeral
          MARIADB_ROOT_PASSWORD: root-ephemeral
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@fc14643b0a99ee9db10a3c025a33d76544fa3761 # 2.30.5
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, curl, json
      - name: Install WordPress CLI and disposable WordPress
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info
          mkdir -p /tmp/file26-ci-wp
          php /tmp/wp-cli.phar core download --version=${{ matrix.wordpress }} --path=/tmp/file26-ci-wp --allow-root --quiet
          php /tmp/wp-cli.phar config create --path=/tmp/file26-ci-wp --dbname=wordpress --dbuser=wordpress --dbpass=wp-ephemeral --dbhost=127.0.0.1:3306 --allow-root --quiet
          php /tmp/wp-cli.phar core install --path=/tmp/file26-ci-wp --url=http://file26-ci.local --title='File26 Disposable CI' --admin_user=admin --admin_password=ci-ephemeral-long-password --admin_email=file26-ci-admin@example.test --skip-email --allow-root --quiet
          mkdir -p /tmp/file26-ci-wp/wp-content/plugins/sabri-file26-search-discovery
          tar -C "$GITHUB_WORKSPACE" --exclude=.git --exclude=release -cf - . | tar -C /tmp/file26-ci-wp/wp-content/plugins/sabri-file26-search-discovery -xf -
          php /tmp/wp-cli.phar plugin activate sabri-file26-search-discovery --path=/tmp/file26-ci-wp --allow-root
      - name: Execute real SQL FR-005 cutover and rollback acceptance
        env:
          FILE26_CI_EPHEMERAL_DB: yes
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file /tmp/file26-ci-wp/wp-content/plugins/sabri-file26-search-discovery/tests/file26-20261109-wordpress-mysql-integration.php --path=/tmp/file26-ci-wp --allow-root

      - name: Run canonical File04 to File26 asynchronous queue receipt contract
        env:
          FILE26_CI_EPHEMERAL_DB: yes
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file /tmp/file26-ci-wp/wp-content/plugins/sabri-file26-search-discovery/tests/file26-20261109-file04-cutover-integration.php --path=/tmp/file26-ci-wp --allow-root
      - name: Verify read-only runtime/deployment freeze on disposable WordPress
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file /tmp/file26-ci-wp/wp-content/plugins/sabri-file26-search-discovery/tools/live-reality-freeze.php --path=/tmp/file26-ci-wp --allow-root > /tmp/file26-ci-freeze.json
          python3 - <<'PY'
          import json
          path = '/tmp/file26-ci-freeze.json'
          with open(path, encoding='utf-8') as f:
              report = json.load(f)
          assert report['audit_contract'] == 'sabri.file26.live-reality-freeze.v1'
          assert report['file26']['plugin_installed'] is True
          assert report['file26']['plugin_active'] is True
          assert report['file26']['declared_plugin_version'] == '1.3.0'
          assert report['file26']['all_plugin_file_count'] > 100
          assert report['file26']['tree_inventory_complete'] is True
          assert len(report['file26']['entry_file_sha256']) == 64
          assert len(report['file26']['all_plugin_files_sha256']) == 64
          assert report['file26']['tables']['documents']['status'] == 'present'
          assert report['file26']['tables']['nodes']['status'] == 'present'
          assert len(report['file26']['owner_runtime_readiness']) == 11
          assert report['file26']['doctor_appeals_schema_option'] is not None
          assert report['live_verified_end_to_end'] is False
          assert report['read_errors'] == []
          print('PASS: read-only WP CLI exact-deployed-artifact and schema freeze')
          PY

      - name: Checkout immutable canonical File21 owner source
